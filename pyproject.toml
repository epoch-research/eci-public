[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eci"
version = "0.2.0"
description = "ECI (Epoch Capabilities Index) fitting for LLM benchmark evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Epoch AI", email = "info@epoch.ai" }
]
keywords = ["llm", "benchmarks", "evaluation", "irt", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "tqdm>=4.60",
    # The Bayesian fit is the default, so its dependencies are not optional.
    # arviz>=1.0 replaced InferenceData with xarray's DataTree and renamed
    # several stats functions' arguments/return attributes (bfmi, loo);
    # the evaluation suite uses that new API and no longer runs on arviz<1.0.
    "pymc>=6.0",
    "arviz>=1.0",
    # arviz>=1.0 made matplotlib an optional plotting backend rather than a
    # hard dependency; eci.evaluation imports it directly for the PDF report.
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://epoch.ai"
Repository = "https://github.com/epoch-research/eci-public"
Documentation = "https://github.com/epoch-research/eci-public#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/eci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
exclude-newer = "7 days"
